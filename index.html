<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>▶ GRAND WAR MONITOR / DIAGNOSTIC FIX</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080b0f; --surface: #0f1318; --surface2: #161c24;
            --border: #252d3a; --border2: #1e2736; --text: #c8d8e8; --muted: #4a5568;
            --accent: #3b82f6; --attack: #ef4444; --defense: #22c55e;
            --fallen: #f97316; --battle: #eab308;
            --mono: 'Share Tech Mono', monospace; --sans: 'Noto Sans JP', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; min-height: 100vh; }
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; position: sticky; top: 0; z-index: 101; }
        .sticky-nav { position: sticky; top: 195px; z-index: 100; background: var(--bg); }
        h1 { font-family: var(--mono); font-size: 14px; letter-spacing: 2px; color: var(--accent); margin-bottom: 12px; text-align: center; }
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .ctrl-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 9px; color: var(--muted); font-weight: bold; white-space: nowrap; }
        select, input { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 4px; font-size: 11px; border-radius: 4px; outline: none; width: 100%; height: 35px; }
        .world-row { grid-column: 1 / -1; margin-top: 4px; }
        .world-info { font-size: 10px; color: var(--accent); background: rgba(59, 130, 246, 0.1); padding: 8px; border-radius: 4px; text-align: center; border: 1px dashed rgba(59, 130, 246, 0.3); font-weight: bold; }
        .manual-row { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 4px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { border: none; color: #fff; padding: 8px; font-size: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; height: 35px; display: flex; align-items: center; justify-content: center; }
        #autoBtn { background: var(--muted); width: 100%; }
        #autoBtn.active { background: var(--defense); box-shadow: 0 0 10px var(--defense); }
        .reset-btn { background: transparent; border: 1px solid var(--attack); color: var(--attack); }
        .status-bar { background: var(--surface); border-bottom: 1px solid var(--border2); padding: 8px 16px; display: flex; flex-direction: column; gap: 8px; }
        .day-tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
        .day-tab { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); padding: 4px 10px; border-radius: 3px; cursor: pointer; font-family: var(--mono); font-size: 10px; }
        .day-tab.active { border-color: var(--accent); color: var(--accent); background: #1a2030; }
        .status-info { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        #clock { font-family: var(--mono); font-weight: bold; color: var(--accent); }
        .guild-summary { background: var(--surface2); border-bottom: 1px solid var(--border); padding: 6px 16px; display: flex; flex-wrap: wrap; gap: 8px; min-height: 42px; }
        .summary-label { font-size: 10px; font-weight: bold; color: var(--muted); border: 1px solid var(--border2); padding: 4px 8px; border-radius: 3px; }
        .guild-chip { background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 3px 10px; border-radius: 3px; font-size: 11px; font-family: var(--mono); }
        .guild-chip b { color: var(--defense); margin-left: 6px; }
        .main { padding: 10px; }
        #tableContainer { width: 100%; overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-family: var(--mono); font-size: 12px; min-width: 1100px; }
        thead th { background: var(--surface2); padding: 12px 10px; text-align: left; color: var(--muted); position: sticky; top: 0; border-bottom: 1px solid var(--border); z-index: 2; }
        tbody td { padding: 10px; border-bottom: 1px solid var(--border2); }
        .time-cell { font-size: 11px; background: rgba(255,255,255,0.03); border-radius: 2px; padding: 2px 4px; text-align: center; }
        .c-defense { color: var(--defense); } .c-attack { color: var(--attack); } .c-battle { color: var(--battle); } .c-fallen { color: var(--fallen); }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .s-battle { background: #3d2e00; color: var(--battle); } .s-fallen { background: #3d1000; color: var(--fallen); } .s-defense { background: #0d3020; color: var(--defense); }
        .indicator { width: 8px; height: 8px; border-radius: 50%; background: #333; display: inline-block; margin-right: 8px; }
        .indicator.active { background: var(--defense); animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @media (min-width: 768px) {
            .controls { grid-template-columns: 1.5fr 1fr 1fr 2fr 1fr 2fr; align-items: flex-end; }
            .world-row, .manual-row { grid-column: auto; }
            .manual-row { display: contents; }
            .sticky-nav { top: 110px; }
        }
    </style>
</head>
<body>

<header>
    <h1>▶ GRAND WAR MONITOR</h1>
    <div class="controls">
        <div class="ctrl-group"><label>GROUP</label><select id="groupSelect"></select></div>
        <div class="ctrl-group"><label>CLASS</label><select id="classSelect"><option value="3" selected>G-Master</option><option value="2">Expert</option><option value="1">Elite</option></select></div>
        <div class="ctrl-group"><label>BLOCK</label><select id="blockSelect"><option value="0">A</option><option value="1" selected>B</option><option value="2">C</option><option value="3">D</option></select></div>
        <div class="world-row"><label>WORLD INFO</label><div id="selectedWorldDisplay" class="world-info">Select a group...</div></div>
        <div class="ctrl-group"><label>MANUAL ID</label><input type="number" id="groupManual" placeholder="ID"></div>
        <div class="btn-group">
            <button id="autoBtn"><span class="indicator"></span>FETCH</button>
            <button id="resetLogBtn" class="reset-btn">RESET</button>
        </div>
    </div>
</header>

<div class="sticky-nav">
    <div class="status-bar">
        <div class="day-tabs" id="dayTabs">
            <span class="day-tab" data-day="Sat">SAT</span><span class="day-tab" data-day="Sun">SUN</span><span class="day-tab" data-day="Tue">TUE</span><span class="day-tab" data-day="Wed">WED</span><span class="day-tab" data-day="Thu">THU</span><span class="day-tab" data-day="Fri">FRI</span>
        </div>
        <div class="status-info"><span id="updateStatus" style="color:var(--accent)">READY</span><span id="clock">00:00:00</span></div>
    </div>
    <div class="guild-summary" id="guildSummary"><div class="summary-label">防衛パーティ数</div></div>
</div>

<div class="main"><div id="tableContainer"></div></div>

<script>
    const BASE_LOG_API = 'https://api.tamamo.dev/GvGLog';
    const CASTLE_API = 'https://tamamo.dev/assets/Resource/CastleId.json';
    const GROUP_DATA = { 18: "W85, W89, W93, W97", 19: "W101-113", 20: "W104-116", 21: "W117-129", 140: "W149-152", 141: "W1,7,12,19", 165: "W97,104,110,115", 180: "W161-W164" }; // 一部省略

    let castleNames = {};
    const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    let currentDay = dayNames[new Date().getDay()] === 'Mon' ? 'Sat' : dayNames[new Date().getDay()];

    // 1. 拠点名取得の修正（アイン・マルクト対応）
    async function fetchCastleNames() {
        try {
            const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(CASTLE_API)}`);
            const data = await res.json();
            // JSONの形式が [{ "id": 0, "name": "アイン" }, ...] であることに合わせる
            data.forEach(item => { castleNames[item.id] = item.name; });
            console.log("Castle Names Loaded:", castleNames);
        } catch (e) { console.error("拠点名取得失敗:", e); }
    }

    async function updateData() {
        const group = document.getElementById('groupManual').value || document.getElementById('groupSelect').value;
        const statusEl = document.getElementById('updateStatus');
        if (!group) return;

        statusEl.textContent = "FETCHING...";
        const params = new URLSearchParams({
            Group: group, 
            Class: document.getElementById('classSelect').value, 
            Block: document.getElementById('blockSelect').value, 
            Week: currentDay,
            _t: Date.now()
        });

        try {
            const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(BASE_LOG_API + '?' + params.toString())}`);
            const json = await res.json();
            const logData = json.data?.Log || [];
            
            renderTable(logData);
            updateGuildSummary(logData);
            statusEl.textContent = "OK: " + new Date().toLocaleTimeString();
        } catch (e) { statusEl.textContent = "ERROR"; }
    }

    function renderTable(data) {
        let html = `<table><thead><tr>
            <th>ID</th><th>拠点名</th><th class="c-defense">防衛ギルド</th><th class="c-attack">侵攻ギルド</th><th>状態</th>
            <th class="c-defense">防衛開始</th><th class="c-battle">攻撃開始</th><th class="c-fallen">陥落時刻</th><th class="c-battle">反撃時刻</th>
        </tr></thead><tbody>`;

        data.sort((a, b) => a.CastleID - b.CastleID).forEach(row => {
            const id = row.CastleID;
            const dGuild = row.DefenseGuildName || "-";
            const aGuild = row.AttackGuildName || "-";
            
            let label = '確定', sClass = 's-defense';
            if (row.FallenTime) { label = '陥落'; sClass = 's-fallen'; }
            else if (row.AttackTime) { label = '宣戦'; sClass = 's-battle'; }

            html += `<tr>
                <td style="color:var(--accent); font-weight:bold;">${id}</td>
                <td><strong>${castleNames[id] || '拠点 '+id}</strong></td>
                <td class="c-defense">${dGuild}</td>
                <td class="c-attack">${aGuild}</td>
                <td><span class="badge ${sClass}">${label}</span></td>
                <td class="time-cell c-defense">${row.DefenseTime || '-'}</td>
                <td class="time-cell c-battle">${row.AttackTime || '-'}</td>
                <td class="time-cell c-fallen">${row.FallenTime || '-'}</td>
                <td class="time-cell c-battle">${row.CounterTime || '-'}</td>
            </tr>`;
        });
        document.getElementById('tableContainer').innerHTML = html + `</tbody></table>`;
    }

    function updateGuildSummary(data) {
        const summary = {};
        data.forEach(row => {
            const name = row.DefenseGuildName;
            if (name) summary[name] = (summary[name] || 0) + (row.DefensePartyCount || 0);
        });
        const sorted = Object.entries(summary).sort((a,b) => b[1] - a[1]);
        document.getElementById('guildSummary').innerHTML = `<div class="summary-label">防衛パーティ数</div>` + 
            sorted.map(([n, c]) => `<div class="guild-chip">${n}<b>${c}P</b></div>`).join('');
    }

    // 初期化
    document.getElementById('autoBtn').addEventListener('click', updateData);
    setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }, 1000);
    
    // グループリスト生成
    const groupSelect = document.getElementById('groupSelect');
    Object.keys(GROUP_DATA).forEach(id => {
        const opt = document.createElement('option'); opt.value = id; opt.textContent = `${id} [${GROUP_DATA[id]}]`;
        groupSelect.appendChild(opt);
    });

    async function init() { await fetchCastleNames(); }
    init();
</script>
</body>
</html>
