<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>▶ GRAND WAR MONITOR / GLOBAL ONLY</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080b0f; --surface: #0f1318; --surface2: #161c24;
            --border: #252d3a; --border2: #1e2736; --text: #c8d8e8; --muted: #4a5568;
            --accent: #3b82f6; 
            --attack: #ff4d4d; /* 攻撃開始：赤 */
            --defense: #22c55e; /* 防衛：緑 */
            --fallen: #f97316; /* 陥落：オレンジ */
            --battle: #eab308; /* 宣戦：黄色 */
            --counter: #a855f7; /* 反撃：紫 */
            --mono: 'Share Tech Mono', monospace; --sans: 'Noto Sans JP', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; min-height: 100vh; }
        
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; position: sticky; top: 0; z-index: 101; }
        .sticky-nav { position: sticky; top: 195px; z-index: 100; background: var(--bg); }

        h1 { font-family: var(--mono); font-size: 14px; letter-spacing: 2px; color: var(--accent); margin-bottom: 12px; text-align: center; }

        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .ctrl-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 9px; color: var(--muted); font-weight: bold; white-space: nowrap; }
        select, input { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 4px; font-size: 11px; border-radius: 4px; outline: none; width: 100%; height: 35px; }

        .world-row { grid-column: 1 / -1; margin-top: 4px; }
        .world-info { 
            font-size: 10px; color: var(--accent); background: rgba(59, 130, 246, 0.1); 
            padding: 8px; border-radius: 4px; text-align: center; display: block; 
            min-height: 1.2em; border: 1px dashed rgba(59, 130, 246, 0.3); font-weight: bold;
        }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; grid-column: 1 / -1; margin-top: 8px; }
        button { border: none; color: #fff; padding: 8px; font-size: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; height: 35px; transition: all 0.2s; }
        #autoBtn { background: var(--accent); }
        #autoBtn:hover { opacity: 0.8; }
        .reset-btn { background: transparent; border: 1px solid var(--attack); color: var(--attack); }

        .status-bar { background: var(--surface); border-bottom: 1px solid var(--border2); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; }
        .day-tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
        .day-tab { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); padding: 4px 10px; border-radius: 3px; cursor: pointer; font-family: var(--mono); font-size: 10px; white-space: nowrap; }
        .day-tab.active { border-color: var(--accent); color: var(--accent); background: #1a2030; }

        .guild-summary { background: var(--surface2); border-bottom: 1px solid var(--border); padding: 6px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 40px; }
        .summary-label { font-size: 10px; font-weight: bold; color: var(--muted); background: rgba(0,0,0,0.3); padding: 4px 8px; border-radius: 3px; border: 1px solid var(--border2); }
        .guild-chip { background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 3px 10px; border-radius: 3px; font-size: 11px; font-family: var(--mono); }
        .guild-chip b { color: var(--defense); margin-left: 6px; }

        .main { padding: 10px; }
        #tableContainer { width: 100%; overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-family: var(--mono); font-size: 12px; min-width: 1150px; }
        thead th { background: var(--surface2); padding: 12px 10px; text-align: left; color: var(--muted); position: sticky; top: 0; border-bottom: 1px solid var(--border); z-index: 2; }
        tbody td { padding: 10px; border-bottom: 1px solid var(--border2); white-space: nowrap; }

        .c-defense { color: var(--defense) !important; }
        .c-attack { color: var(--attack) !important; }
        .c-fallen { color: var(--fallen) !important; }
        .c-counter { color: var(--counter) !important; }
        .c-battle { color: var(--battle) !important; }

        .time-cell { font-size: 11px; background: rgba(255,255,255,0.03); border-radius: 2px; padding: 2px 4px; text-align: center; font-weight: bold; }
        
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; text-align: center; min-width: 50px; }
        .s-defense { background: rgba(34, 197, 94, 0.15); color: var(--defense); border: 1px solid var(--defense); }
        .s-battle { background: rgba(234, 179, 8, 0.15); color: var(--battle); border: 1px solid var(--battle); }
        .s-fallen { background: rgba(249, 115, 22, 0.15); color: var(--fallen); border: 1px solid var(--fallen); }

        @media (min-width: 768px) {
            .controls { grid-template-columns: 1fr 1fr 1fr 1fr 2fr 1fr 1fr; align-items: flex-end; }
            .world-row, .btn-group { grid-column: auto; margin-top: 0; }
            .sticky-nav { top: 110px; } 
        }
    </style>
</head>
<body>

<header>
    <h1>▶ GRAND WAR MONITOR [GLOBAL]</h1>
    <div class="controls">
        <div class="ctrl-group"><label>MODE</label><select id="modeSelect" disabled><option value="global" selected>Global</option></select></div>
        <div class="ctrl-group"><label>GROUP</label><select id="groupSelect"></select></div>
        <div class="ctrl-group"><label>CLASS</label><select id="classSelect"><option value="3" selected>G-Master</option><option value="2">Expert</option><option value="1">Elite</option></select></div>
        <div class="ctrl-group"><label>BLOCK</label><select id="blockSelect"><option value="0">A</option><option value="1" selected>B</option><option value="2">C</option><option value="3">D</option></select></div>
        <div class="world-row"><label>WORLD INFO</label><div id="selectedWorldDisplay" class="world-info">Select...</div></div>
        <div class="ctrl-group"><label>ID MANUAL</label><input type="number" id="groupManual" placeholder="ID"></div>
        <div class="btn-group">
            <button id="autoBtn">FETCH</button>
            <button id="resetLogBtn" class="reset-btn" onclick="location.reload()">RESET</button>
        </div>
    </div>
</header>

<div class="sticky-nav">
    <div class="status-bar">
        <div class="day-tabs" id="dayTabs">
            <span class="day-tab" data-day="Sat">SAT</span><span class="day-tab" data-day="Sun">SUN</span><span class="day-tab" data-day="Tue">TUE</span><span class="day-tab" data-day="Wed">WED</span><span class="day-tab" data-day="Thu">THU</span><span class="day-tab" data-day="Fri">FRI</span>
        </div>
        <div class="status-info"><span id="updateStatus" style="color:var(--accent)">READY</span> | <span id="clock">00:00:00</span></div>
    </div>
    <div class="guild-summary" id="guildSummary"><div class="summary-label">防衛パーティ数</div></div>
</div>
<div id="debugOutput" style="color: #eab308; font-size: 11px; padding: 10px; background: rgba(0,0,0,0.5); word-break: break-all;">
    ※ここに実際のデータ構造が表示されます（確認後はお教えください）
</div>
<div class="main"><div id="tableContainer"></div></div>

<script>
    const BASE_LOG_API = 'https://api.tamamo.dev/GvGLog';
    const CASTLE_API = 'https://tamamo.dev/assets/Resource/CastleId.json';
    
    const GLOBAL_CASTLE_MAP = {
        "1": "アイン", "2": "イエソド", "3": "マルクト", "4": "ケテル", "5": "テファレト",
        "6": "クシェル", "7": "シトリ", "8": "トパズ", "9": "メラル", "10": "ペリド",
        "11": "ファリア", "12": "ラピス", "13": "ラリマル", "14": "マリン", "15": "アメト",
        "16": "ラベン", "17": "シルコン", "18": "オニキス", "19": "フロライト", "20": "ガネット",
        "21": "ルラ"
    };

    const GROUP_DATA = { 
        18: "W85, W89, W93, W97", 19: "W101, W105, W109, W113", 20: "W104, W108, W112, W116", 21: "W117, W121, W125, W129",
        140: "W149-152", 141: "W1, W7, W12, W19", 142: "W2, W8, W20, W27", 143: "W3, W4, W13, W31", 144: "W5, W9, W21, W30", 
        145: "W6, W14, W15, W32", 146: "W10, W18, W24, W29", 147: "W11, W17, W22, W26", 148: "W16, W23, W25, W28", 
        149: "W33, W54, W60, W63", 150: "W34, W43, W51, W61", 151: "W35, W44, W48, W53", 152: "W36, W38, W47, W64", 
        153: "W37, W46, W57, W58", 154: "W39, W52, W56, W62", 155: "W40, W41, W42, W55", 156: "W45, W49, W50, W59", 
        157: "W65, W67, W78, W96", 158: "W66, W69, W76, W85", 159: "W68, W70, W84, W93", 160: "W71, W75, W82, W89", 
        161: "W72, W79, W86, W91", 162: "W73, W83, W90, W95", 163: "W74, W80, W87, W94", 164: "W77, W81, W88, W92", 
        165: "W97, W104, W110, W115", 166: "W98, W103, W108, W113", 167: "W99, W102, W109, W116", 168: "W100, W105, W107, W114", 
        169: "W101, W106, W111, W112", 170: "W117, W127, W129, W132", 171: "W118, W124, W126, W131", 172: "W119, W121, W122, W125", 
        173: "W120, W123, W128, W130", 174: "W133, W139, W143, W148", 175: "W134, W137, W142, W145", 176: "W135, W138, W144, W147", 
        177: "W136, W140, W141, W146", 178: "W153, W154, W155, W156", 179: "W157, W158, W159, W160", 180: "W161-W164"
    };

    let castleNames = { ...GLOBAL_CASTLE_MAP };
    const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    let currentDay = dayNames[new Date().getDay()] === 'Mon' ? 'Sat' : dayNames[new Date().getDay()];

    async function fetchCastleNames() {
        try {
            const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(CASTLE_API + '?_t=' + Date.now())}`);
            const data = await res.json();
            
            if (data.globalGvG) {
                Object.entries(data.globalGvG).forEach(([name, id]) => {
                    castleNames[String(id)] = name;
                });
            } else if (Array.isArray(data)) {
                data.forEach(item => { castleNames[String(item.id)] = item.name; });
            }
        } catch (e) { 
            console.error("Castle names fetch error, using fallback map."); 
        }
    }

    async function updateData() {
        const group = document.getElementById('groupManual').value || document.getElementById('groupSelect').value;
        const statusEl = document.getElementById('updateStatus');
        if (!group) return;

        statusEl.textContent = "FETCHING...";
        const params = new URLSearchParams({
            Group: group, 
            Class: document.getElementById('classSelect').value,
            Block: document.getElementById('blockSelect').value, 
            Week: currentDay, 
            _t: Date.now()
        });

        try {
            const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(BASE_LOG_API + '?' + params.toString())}`);
            const json = await res.json();
            const logData = json.data?.Log || [];

            // ★ デバッグ用：取得したデータの最初の1拠点分の生データを画面に表示
            if(logData.length > 0) {
                const debugDiv = document.getElementById('debugOutput');
                if(debugDiv) {
                    debugDiv.textContent = "【デバッグ情報】 " + JSON.stringify(logData[0]);
                }
            }

            renderTable(logData);
            updateGuildSummary(logData);
            statusEl.textContent = "OK (" + currentDay + "): " + new Date().toLocaleTimeString();
        } catch (e) { statusEl.textContent = "ERROR"; }
    }

    function renderTable(data) {
        // ★修正点1：テーブルのヘッダーに「防衛PT数」の列（th）を追加しました。
        let html = `<table><thead><tr>
            <th>ID</th><th>拠点名</th><th class="c-defense">防衛ギルド</th><th class="c-defense" style="text-align:center;">防衛PT数</th><th class="c-attack">侵攻ギルド</th><th>状態</th>
            <th class="c-defense">防衛開始</th><th class="c-attack">攻撃開始</th><th class="c-fallen">陥落時刻</th><th class="c-counter">反撃時刻</th>
        </tr></thead><tbody>`;

        // ★修正点2：IDのプロパティ名のブレも吸収するようにしました。
        data.sort((a, b) => (a.CastleID || a.castleId || a.castleID) - (b.CastleID || b.castleId || b.castleID)).forEach(row => {
            const id = String(row.CastleID || row.castleId || row.castleID);
            
            // ★修正点3：APIのキー名が多少違っても対応できるように複数の候補を記述しました。
            const dGuild = row.DefenseGuildName || row.defenseGuildName || row.DefenseGuild || row.defenseGuild || "-";
            const aGuild = row.AttackGuildName || row.attackGuildName || row.AttackGuild || row.attackGuild || "-";
            const dParty = row.DefensePartyCount || row.defensePartyCount || row.PartyCount || row.partyCount || "0";
            
            const cName = castleNames[id] || `拠点 ${id}`;
            
            let label = '確定', sClass = 's-defense';
            if (row.FallenTime || row.fallenTime) { 
                label = '陥落'; sClass = 's-fallen'; 
            } else if (row.AttackTime || row.attackTime || (aGuild !== "-")) { 
                label = '宣戦'; sClass = 's-battle'; 
            }

            // ★修正点4：「防衛PT数（dParty）」を表示するセル（td）を追加しました。
            html += `<tr>
                <td style="color:var(--accent); font-weight:bold;">${id}</td>
                <td><strong>${cName}</strong></td>
                <td class="c-defense">${dGuild}</td>
                <td class="c-defense" style="text-align:center;"><strong>${dParty}</strong></td>
                <td class="c-attack">${aGuild}</td>
                <td><span class="badge ${sClass}">${label}</span></td>
                <td class="time-cell c-defense">${row.DefenseTime || row.defenseTime || '-'}</td>
                <td class="time-cell c-attack">${row.AttackTime || row.attackTime || '-'}</td>
                <td class="time-cell c-fallen">${row.FallenTime || row.fallenTime || '-'}</td>
                <td class="time-cell c-counter">${row.CounterTime || row.counterTime || '-'}</td>
            </tr>`;
        });
        document.getElementById('tableContainer').innerHTML = html + `</tbody></table>`;
    }

    function updateGuildSummary(data) {
        const summary = {};
        data.forEach(row => {
            // ★サマリー部分も同様に複数候補に対応
            const name = row.DefenseGuildName || row.defenseGuildName || row.DefenseGuild || row.defenseGuild;
            if (name && name !== "-") {
                const count = row.DefensePartyCount || row.defensePartyCount || row.PartyCount || row.partyCount || 0;
                summary[name] = (summary[name] || 0) + Number(count);
            }
        });
        const sorted = Object.entries(summary).sort((a,b) => b[1] - a[1]);
        document.getElementById('guildSummary').innerHTML = `<div class="summary-label">防衛パーティ数</div>` + 
            sorted.map(([n, c]) => `<div class="guild-chip">${n}<b>${c}P</b></div>`).join('');
    }

    function setupDayTabs() {
        const tabsContainer = document.getElementById('dayTabs');
        tabsContainer.querySelectorAll('.day-tab').forEach(tab => {
            if (tab.dataset.day === currentDay) tab.classList.add('active');
            tab.addEventListener('click', () => {
                tabsContainer.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentDay = tab.dataset.day;
                updateData();
            });
        });
    }

    function setupGroupSelect() {
        const groupSelect = document.getElementById('groupSelect');
        const display = document.getElementById('selectedWorldDisplay');
        
        const defaultOpt = document.createElement('option');
        defaultOpt.value = ""; defaultOpt.textContent = "選択してください";
        groupSelect.appendChild(defaultOpt);

        Object.keys(GROUP_DATA).sort((a,b) => a-b).forEach(id => {
            const opt = document.createElement('option'); 
            opt.value = id; 
            opt.textContent = `${id} [${GROUP_DATA[id]}]`;
            groupSelect.appendChild(opt);
        });

        groupSelect.addEventListener('change', () => {
            if (groupSelect.value) {
                display.textContent = `World: ${GROUP_DATA[groupSelect.value]}`;
                updateData();
            } else {
                display.textContent = "Select...";
            }
        });
    }

    document.getElementById('autoBtn').addEventListener('click', updateData);
    setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }, 1000);
    
    async function init() { 
        setupDayTabs();
        setupGroupSelect();
        await fetchCastleNames(); 
    }
    init();
</script>
</body>
</html>
