<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>▶ GRAND WAR MONITOR / GLOBAL ONLY</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080b0f; --surface: #0f1318; --surface2: #161c24;
            --border: #252d3a; --border2: #1e2736; --text: #c8d8e8; --muted: #4a5568;
            --accent: #3b82f6; --attack: #ff4d4d; --defense: #22c55e;
            --fallen: #f97316; --battle: #eab308; --counter: #a855f7;
            --mono: 'Share Tech Mono', monospace; --sans: 'Noto Sans JP', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; min-height: 100vh; }
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; }
        .sticky-nav { position: sticky; top: 0; z-index: 100; background: var(--bg); }
        h1 { font-family: var(--mono); font-size: 14px; letter-spacing: 2px; color: var(--accent); margin-bottom: 12px; text-align: center; }
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .ctrl-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 9px; color: var(--muted); font-weight: bold; }
        select, input { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 4px; font-size: 11px; border-radius: 4px; height: 35px; outline: none; }
        .world-row { grid-column: 1 / -1; margin-top: 4px; }
        .world-info { font-size: 10px; color: var(--accent); background: rgba(59, 130, 246, 0.1); padding: 8px; border-radius: 4px; text-align: center; border: 1px dashed rgba(59, 130, 246, 0.3); font-weight: bold; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; grid-column: 1 / -1; margin-top: 8px; }
        button { border: none; color: #fff; padding: 8px; font-size: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; height: 35px; }
        #autoBtn { background: var(--accent); }
        .reset-btn { background: transparent; border: 1px solid var(--attack); color: var(--attack); }
        .status-bar { background: var(--surface); border-bottom: 1px solid var(--border2); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; }
        .day-tabs { display: flex; gap: 4px; overflow-x: auto; }
        .day-tab { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); padding: 4px 10px; border-radius: 3px; cursor: pointer; font-family: var(--mono); font-size: 10px; }
        .day-tab.active { border-color: var(--accent); color: var(--accent); background: #1a2030; }
        .guild-summary { background: var(--surface2); border-bottom: 1px solid var(--border); padding: 6px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 40px; }
        .summary-label { font-size: 10px; font-weight: bold; }
        .guild-chip { background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 3px 10px; border-radius: 3px; font-size: 11px; font-family: var(--mono); }
        .guild-chip b { color: var(--defense); margin-left: 6px; }
        .main { padding: 10px; }
        #tableContainer { width: 100%; overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-family: var(--mono); font-size: 12px; min-width: 1000px; table-layout: fixed; }
        thead th { background: var(--surface2); padding: 12px 6px; text-align: center; color: var(--muted); position: sticky; top: 0; border-bottom: 1px solid var(--border); z-index: 2; }
        tbody td { padding: 10px 6px; border-bottom: 1px solid var(--border2); text-align: center; }
        .c-defense { color: var(--defense) !important; }
        .c-attack { color: var(--attack) !important; }
        .time-cell { font-size: 11px; background: rgba(255,255,255,0.03); border-radius: 2px; padding: 2px 4px; font-weight: bold; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; min-width: 50px; }
        .s-defense { background: rgba(34, 197, 94, 0.15); color: var(--defense); border: 1px solid var(--defense); }
        .s-battle { background: rgba(234, 179, 8, 0.15); color: var(--battle); border: 1px solid var(--battle); }
        .s-fallen { background: rgba(249, 115, 22, 0.15); color: var(--fallen); border: 1px solid var(--fallen); }
        @media (min-width: 768px) {
            .controls { grid-template-columns: 1fr 1fr 1fr 2fr 1fr 1fr; align-items: flex-end; }
            .world-row, .btn-group { grid-column: auto; margin-top: 0; }
        }
    </style>
</head>
<body>

<header>
    <h1>▶ GRAND WAR MONITOR [GLOBAL]</h1>
    <div class="controls">
        <div class="ctrl-group"><label>GROUP</label><select id="groupSelect"></select></div>
        <div class="ctrl-group"><label>CLASS</label><select id="classSelect"><option value="3" selected>G-Master</option><option value="2">Expert</option><option value="1">Elite</option></select></div>
        <div class="ctrl-group"><label>BLOCK</label><select id="blockSelect"><option value="0">A</option><option value="1" selected>B</option><option value="2">C</option><option value="3">D</option></select></div>
        <div class="world-row"><label>WORLD INFO</label><div id="selectedWorldDisplay" class="world-info">Select...</div></div>
        <div class="ctrl-group"><label>ID MANUAL</label><input type="number" id="groupManual" placeholder="ID"></div>
        <div class="btn-group">
            <button id="autoBtn">FETCH</button>
            <button id="resetLogBtn" class="reset-btn" onclick="location.reload()">RESET</button>
        </div>
    </div>
</header>

<div class="sticky-nav">
    <div class="status-bar">
        <div class="day-tabs" id="dayTabs">
            <span class="day-tab" data-day="Sat">SAT</span><span class="day-tab" data-day="Sun">SUN</span><span class="day-tab" data-day="Tue">TUE</span><span class="day-tab" data-day="Wed">WED</span><span class="day-tab" data-day="Thu">THU</span><span class="day-tab" data-day="Fri">FRI</span>
        </div>
        <div class="status-info"><span id="updateStatus" style="color:var(--accent)">READY</span> | <span id="clock">00:00:00</span></div>
    </div>
    <div class="guild-summary" id="guildSummary"><div class="summary-label">🏰 現在の防衛パーティ数 </div></div>
</div>

<div class="main"><div id="tableContainer"></div></div>

<script>
    const PROXY = 'https://corsproxy.io/?';
    const BASE_LOG_API = 'https://api.tamamo.dev/GvGLog';
    const CASTLE_API = 'https://tamamo.dev/assets/Resource/CastleId.json';
    
    const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    // 初期選択：現在が月曜なら土曜、それ以外なら今日
    let currentDay = dayNames[new Date().getDay()] === 'Mon' ? 'Sat' : dayNames[new Date().getDay()];

    let ws = null;
    let wsGuildData = {};
    let wsCastleData = [];
    let castleNames = {};

    async function fetchCastleNames() {
        try {
            const res = await fetch(`${PROXY}${encodeURIComponent(CASTLE_API)}`);
            if(res.ok) {
                const data = await res.json();
                if (data.globalGvG) {
                    Object.entries(data.globalGvG).forEach(([name, id]) => { castleNames[String(id)] = name; });
                }
            }
        } catch (e) { console.warn("Names fetch error"); }
    }

    async function updateData() {
        const group = document.getElementById('groupManual').value || document.getElementById('groupSelect').value;
        const classId = document.getElementById('classSelect').value;
        const blockId = document.getElementById('blockSelect').value;
        const statusEl = document.getElementById('updateStatus');
        if (!group) return;

        // WebSocketとデータをクリア
        if (ws) { ws.close(); ws = null; }
        wsCastleData = [];
        wsGuildData = {};

        // 厳格な「今日」判定用の文字列 (YYYY-MM-DD)
        const now = new Date();
        const todayStr = now.toISOString().split('T')[0];
        const realTodayDayName = dayNames[now.getDay()];

        // 「今選択しているタブ」が「実際の今日」かどうか
        const isTodaySelected = (currentDay === realTodayDayName);

        statusEl.textContent = "FETCHING...";
        const params = new URLSearchParams({ 
            Group: group, Class: classId, Block: blockId, Week: currentDay, 
            _t: Date.now() 
        });

        let logDataArray = [];
        try {
            const res = await fetch(`${PROXY}${encodeURIComponent(BASE_LOG_API + '?' + params.toString())}`);
            if (res.ok) {
                const json = await res.json();
                logDataArray = json.data?.Log || [];
            }
        } catch (e) { console.error("Log fetch error"); }

        // もし「今日」のタブならWebSocketを開始
        if (isTodaySelected) {
            ws = new WebSocket("wss://api.mentemori.icu/gvg");
            ws.binaryType = "arraybuffer";
            ws.onopen = () => {
                let buffer = new ArrayBuffer(4);
                let view = new DataView(buffer);
                let val = (0 << 19) | (Number(classId) << 16) | (Number(group) << 8) | (Number(blockId) << 5) | 0;
                view.setUint32(0, val, true);
                ws.send(buffer);
            };
            ws.onmessage = (event) => {
                let v = new DataView(event.data);
                let offset = 0;
                while(offset < v.byteLength) {
                    let a = v.getUint32(offset, true);
                    let s = { GroupId: (a >>> 8) & 255, CastleId: a & 31 };
                    offset += 4;
                    if(s.GroupId != group) break;
                    if (s.CastleId === 0) {
                        let ga = v.getUint32(offset, true), l = v.getUint8(offset + 4, true);
                        wsGuildData[1000 * ga] = new TextDecoder("utf-8").decode(new Uint8Array(v.buffer, offset + 5, l));
                        offset += (5 + l);
                    } else if (s.CastleId <= 21) {
                        wsCastleData[s.CastleId] = { 
                            GuildId: 1000 * v.getUint32(offset, true), 
                            AttackerGuildId: 1000 * v.getUint32(offset + 4, true),
                            DefensePartyCount: v.getUint16(offset + 12, true),
                            AttackPartyCount: v.getUint16(offset + 14, true),
                            GvgCastleState: v.getUint8(offset + 16, true)
                        };
                        offset += 20;
                    } else break;
                }
                combineAndRender(logDataArray, isTodaySelected, todayStr);
            };
        } else {
            // 過去日タブの場合はWebSocketなしで即描画
            combineAndRender(logDataArray, false, todayStr);
        }
        statusEl.textContent = "OK"; 
    }

    function combineAndRender(logDataArray, isTodaySelected, todayStr) {
        let combinedData = [];
        const selectedDay = currentDay; 

        for (let i = 1; i <= 21; i++) {
            // ログのフィルタリング
            let logInfo = logDataArray.find(d => {
                const isIdMatch = String(d.CastleID) === String(i);
                const isWeekMatch = d.Week === selectedDay;
                // Created日付を取得
                const logDate = d.Created ? d.Created.split(' ')[0] : "";

                if (isTodaySelected) {
                    // 今日タブの場合：拠点が一致し、かつ日付が今日のものだけ
                    return isIdMatch && isWeekMatch && logDate === todayStr;
                } else {
                    // 過去タブの場合：拠点と曜日が一致していればOK
                    return isIdMatch && isWeekMatch;
                }
            }) || {};
            
            let wsInfo = wsCastleData[i] || {};
            let dName = "-", aName = "-", dP = 0, aP = 0;
            
            // WebSocketデータ（リアルタイム）を結合するのは「今日タブ」の時だけ
            if (isTodaySelected) {
                dName = wsGuildData[wsInfo.GuildId] || "-";
                aName = wsGuildData[wsInfo.AttackerGuildId] || "-";
                dP = wsInfo.DefensePartyCount || 0;
                aP = wsInfo.AttackPartyCount || 0;
                if (wsInfo.GvgCastleState == 2 || wsInfo.GvgCastleState == 3) {
                    let t = dName; dName = aName; aName = t;
                }
            }

            const hasLog = (logInfo.DefenseTime || logInfo.AttackTime || logInfo.FallenTime);

            combinedData.push({
                CastleID: i, 
                DefenseGuildName: logInfo.DefenseGuildName || dName, 
                AttackGuildName: logInfo.AttackGuildName || aName,
                DefensePartyCount: dP, 
                AttackPartyCount: aP,
                DefenseTime: hasLog ? (logInfo.DefenseTime || "-") : "-",
                AttackTime:  hasLog ? (logInfo.AttackTime || "-") : "-",
                FallenTime:  hasLog ? (logInfo.FallenTime || "-") : "-",
                CounterTime: hasLog ? (logInfo.CounterTime || "-") : "-"
            });
        }

        let html = `<table><thead><tr><th>ID</th><th>拠点名</th><th class="c-defense">防衛ギルド</th><th>防衛/侵攻PT</th><th class="c-attack">侵攻ギルド</th><th>状態</th><th class="c-defense">防衛開始</th><th class="c-attack">攻撃開始</th><th class="c-fallen">陥落時刻</th><th class="c-counter">反撃時刻</th></tr></thead><tbody>`;
        combinedData.forEach(row => {
            const name = castleNames[row.CastleID] || `拠点 ${row.CastleID}`;
            let label = '確定', sClass = 's-defense';
            if (row.FallenTime !== "-") { label = '陥落'; sClass = 's-fallen'; }
            else if (row.AttackTime !== "-" || row.AttackGuildName !== "-") { label = '宣戦'; sClass = 's-battle'; }
            else if (row.DefenseTime !== "-") { label = '防衛中'; sClass = 's-defense'; }

            html += `<tr>
                <td style="color:var(--accent); font-weight:bold;">${row.CastleID}</td>
                <td><strong>${name}</strong></td>
                <td class="c-defense">${row.DefenseGuildName}</td>
                <td><strong class="c-defense">${row.DefensePartyCount}</strong> / <strong class="c-attack">${row.AttackPartyCount}</strong></td>
                <td class="c-attack">${row.AttackGuildName}</td>
                <td><span class="badge ${sClass}">${label}</span></td>
                <td class="time-cell c-defense">${row.DefenseTime}</td>
                <td class="time-cell c-attack">${row.AttackTime}</td>
                <td class="time-cell c-fallen">${row.FallenTime}</td>
                <td class="time-cell c-counter">${row.CounterTime}</td>
            </tr>`;
        });
        document.getElementById('tableContainer').innerHTML = html + `</tbody></table>`;
        updateGuildSummary(combinedData);
    }

    function updateGuildSummary(data) {
        const sum = {};
        data.forEach(r => { if(r.DefenseGuildName !== "-") sum[r.DefenseGuildName] = (sum[r.DefenseGuildName] || 0) + Number(r.DefensePartyCount); });
        const sorted = Object.entries(sum).sort((a,b) => b[1] - a[1]);
        document.getElementById('guildSummary').innerHTML = `<div class="summary-label">🏰 防衛パーティ数</div>` + 
            sorted.map(([n, c]) => `<div class="guild-chip">${n}<b>${c}P</b></div>`).join('');
    }

    function setupDayTabs() {
        const cont = document.getElementById('dayTabs');
        cont.querySelectorAll('.day-tab').forEach(t => {
            if (t.dataset.day === currentDay) t.classList.add('active');
            t.addEventListener('click', () => {
                cont.querySelectorAll('.day-tab').forEach(x => x.classList.remove('active'));
                t.classList.add('active');
                currentDay = t.dataset.day;
                updateData();
            });
        });
    }

    const GROUP_DATA = { 140: "W149-152", 141: "W1, W7, W12, W19", 142: "W2, W8, W20, W27", 143: "W3, W4, W13, W31", 144: "W5, W9, W21, W30", 145: "W6, W14, W15, W32", 146: "W10, W18, W24, W29", 147: "W11, W17, W22, W26", 148: "W16, W23, W25, W28", 149: "W33, W54, W60, W63", 150: "W34, W43, W51, W61", 151: "W35, W44, W48, W53", 152: "W36, W38, W47, W64", 153: "W37, W46, W57, W58", 154: "W39, W52, W56, W62", 155: "W40, W41, W42, W55", 156: "W45, W49, W50, W59", 157: "W65, W67, W78, W96", 158: "W66, W69, W76, W85", 159: "W68, W70, W84, W93", 160: "W71, W75, W82, W89", 161: "W72, W79, W86, W91", 162: "W73, W83, W90, W95", 163: "W74, W80, W87, W94", 164: "W77, W81, W88, W92", 165: "W97, W104, W110, W115", 166: "W98, W103, W108, W113", 167: "W99, W102, W109, W116", 168: "W100, W105, W107, W114", 169: "W101, W106, W111, W112", 170: "W117, W127, W129, W132", 171: "W118, W124, W126, W131", 172: "W119, W121, W122, W125", 173: "W120, W123, W128, W130", 174: "W133, W139, W143, W148", 175: "W134, W137, W142, W145", 176: "W135, W138, W144, W147", 177: "W136, W140, W141, W146", 178: "W153, W154, W155, W156", 179: "W157, W158, W159, W160", 180: "W161-W164" };

    function setupGroupSelect() {
        const s = document.getElementById('groupSelect');
        const d = document.getElementById('selectedWorldDisplay');
        Object.keys(GROUP_DATA).sort((a,b)=>a-b).forEach(id => {
            const o = document.createElement('option'); o.value = id; o.textContent = `${id} [${GROUP_DATA[id]}]`;
            if (o.textContent.includes("W104")) { o.style.backgroundColor = "#eab308"; o.style.color = "#000"; }
            s.appendChild(o);
        });
        s.addEventListener('change', () => { if(s.value){ d.textContent=`World: ${GROUP_DATA[s.value]}`; updateData(); } });
    }

    document.getElementById('autoBtn').addEventListener('click', updateData);
    setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }, 1000);
    async function init() { setupDayTabs(); setupGroupSelect(); await fetchCastleNames(); }
    init();
</script>
</body>
</html>
